version: "3.8"

services:

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always

    ports:
      - "8081:8080"

    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: airbnb-bot-123
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://airbnb:airbnb@postgres:5432/airbnbdb?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: true
      DATABASE_SAVE_DATA_NEW_MESSAGE: true
      DATABASE_SAVE_MESSAGE_UPDATE: true
      DATABASE_SAVE_DATA_CONTACTS: true
      DATABASE_SAVE_DATA_CHATS: true
      DATABASE_SAVE_DATA_LABELS: true
      DATABASE_SAVE_DATA_HISTORIC: true
      CACHE_REDIS_ENABLED: true
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution_exchange
      CACHE_REDIS_SAVE_INSTANCES: false
      CACHE_LOCAL_ENABLED: false

    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - airbnb_net
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: airbnb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: airbnb
      POSTGRES_DB: airbnbdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airbnb_net

  redis:
    image: redis:7-alpine
    container_name: airbnb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - airbnb_net

volumes:
  evolution_instances:
  db_data:

networks:
  airbnb_net:
    driver: bridge

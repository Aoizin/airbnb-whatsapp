<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Página não encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3f2;
            --card: rgba(255, 255, 255, 0.9);
            --primary: #1f2937;
            --muted: #6b7280;
            --soft: #f3f4f6;
            --brand: #eb5f7a;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            background: radial-gradient(circle at top, #fff7f8 0%, #f5f3f2 28%, #ece7e5 100%);
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--primary);
        }

        .box {
            width: min(760px, calc(100vw - 28px));
            background: var(--card);
            border: 1px solid rgba(17, 24, 39, 0.08);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            padding: 34px 28px 30px;
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 18px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #fb7185 0%, #be123c 100%);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(190, 18, 60, 0.2);
        }

        .code {
            display: inline-block;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: -0.08em;
            color: var(--brand);
            margin: 8px 0 12px;
        }

        h1 {
            font-size: clamp(1.9rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin: 0 0 12px;
        }

        p {
            color: var(--muted);
            font-size: 1.08rem;
            margin: 0 0 24px;
            line-height: 1.7;
        }

        .btn-primary {
            background: linear-gradient(135deg, #111827 0%, #374151 100%);
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1.15rem;
            font-weight: 600;
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.18);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="brand">
            <span class="brand-mark">A</span>
            <span>Airbnb WhatsApp</span>
        </div>

        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>O endereço informado não existe, foi movido ou ainda não está disponível.</p>
        <a class="btn btn-primary" th:href="@{/admin/dashboard}">Voltar ao painel</a>
    </div>
</body>
</html>

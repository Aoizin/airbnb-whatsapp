<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head"></head>
<body>
<div th:fragment="body">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Hospedagens</h1>
        <a class="btn btn-primary" th:href="@{/admin/hospedagens}">Atualizar</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/admin/hospedagens}">
        <div class="col-md-2">
            <input class="form-control" name="apartamento" placeholder="Apartamento" th:value="${apartamento}">
        </div>
        <div class="col-md-2">
            <input class="form-control" name="responsavel" placeholder="Responsável" th:value="${responsavel}">
        </div>
        <div class="col-md-2">
            <select class="form-select" name="status">
                <option value="" th:selected="${status==null}">Todos</option>
                <option value="PENDING" th:selected="${status=='PENDING'}">Pendente</option>
                <option value="CONFIRMED" th:selected="${status=='CONFIRMED'}">Confirmado</option>
                <option value="CANCELLED" th:selected="${status=='CANCELLED'}">Cancelado</option>
                <option value="COMPLETED" th:selected="${status=='COMPLETED'}">Finalizado</option>
            </select>
        </div>
        <div class="col-md-2">
            <input type="date" class="form-control" name="checkinStart" th:value="${checkinStart}">
        </div>
        <div class="col-md-2">
            <input type="date" class="form-control" name="checkinEnd" th:value="${checkinEnd}">
        </div>
        <div class="col-md-2">
            <input class="form-control" name="search" placeholder="Pesquisar" th:value="${search}">
        </div>
        <div class="col-12 text-end mt-2">
            <button class="btn btn-secondary">Filtrar</button>
        </div>
    </form>

    <div th:fragment="tableFragment (hospedagens)">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Apartamento</th>
                    <th>Responsável</th>
                    <th>Check-in</th>
                    <th>Check-out</th>
                    <th>Pessoas</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${hospedagens.content}">
                    <td th:text="${h.apartamento}">501</td>
                    <td th:text="${h.responsavel}">João</td>
                    <td th:text="${h.checkinDate}">2026-08-01</td>
                    <td th:text="${h.checkoutDate}">2026-08-05</td>
                    <td th:text="${h.qtdHospedes}">2</td>
                    <td th:text="${h.status}">PENDING</td>
                    <td>
                        <a th:href="@{'/admin/hospedagens/' + ${h.id}}" class="btn btn-sm btn-outline-primary">Detalhes</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav>
            <ul class="pagination">
                <li class="page-item" th:classappend="${hospedagens.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/hospedagens(page=${hospedagens.number-1},size=${hospedagens.size})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, hospedagens.totalPages-1)}" th:classappend="${i==hospedagens.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/hospedagens(page=${i},size=${hospedagens.size})}" th:text="${i+1}">1</a>
                </li>
                <li class="page-item" th:classappend="${hospedagens.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/hospedagens(page=${hospedagens.number+1},size=${hospedagens.size})}">Próximo</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>

<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${status != null ? status : 'Erro'} - Airbnb WhatsApp|">Erro - Airbnb WhatsApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3f2;
            --panel: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(17, 24, 39, 0.08);
            --primary: #1f2937;
            --muted: #6b7280;
            --soft: #f3f4f6;
            --rose: #f43f5e;
            --rose-soft: #ffe4e6;
            --shadow: rgba(15, 23, 42, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #fff7f8 0%, #f3f4f6 30%, #ece7e5 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--primary);
        }

        .shell {
            width: min(820px, calc(100vw - 28px));
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            box-shadow: 0 24px 60px var(--shadow);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: linear-gradient(135deg, #fdf2f8 0%, #f5f3f2 100%);
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            padding: 18px 28px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #fb7185 0%, #be123c 100%);
            display: grid;
            place-items: center;
            color: white;
            font-size: 0.9rem;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(190, 18, 60, 0.18);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--rose-soft);
            color: var(--rose);
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.11em;
            font-weight: 800;
            margin: 0 0 18px 0;
        }

        .content {
            padding: 32px 28px 30px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        p {
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.7;
            margin: 0 0 14px;
        }

        .meta {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.3);
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.9;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #111827 0%, #374151 100%);
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1.15rem;
            font-weight: 600;
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.18);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
        }

        .btn-light {
            background: #fff;
            border: 1px solid rgba(17, 24, 39, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1.15rem;
            font-weight: 600;
            color: var(--primary);
        }

        @media (max-width: 640px) {
            .content { padding: 24px 20px 26px; }
            .topbar { padding: 14px 18px; }
            .brand { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="topbar">
            <div class="brand">
                <span class="brand-mark">A</span>
                <span>Airbnb WhatsApp</span>
            </div>
            <span class="status-pill" th:text="${status != null ? status : 'Erro'}">500</span>
        </div>

        <div class="content">
            <h1>Ops! Algo deu errado</h1>

            <p th:text="${message != null ? message : 'A página que você tentou acessar não está disponível no momento ou houve um problema no sistema.'}">
                A página que você tentou acessar não está disponível no momento ou houve um problema no sistema.
            </p>

            <p th:if="${error != null}" th:text="|Detalhe: ${error}|">Detalhe: Internal Server Error</p>

            <div class="meta">
                <div th:if="${path != null}">Rota acessada: <strong th:text="${path}">/</strong></div>
                <div th:if="${timestamp != null}">Horário: <strong th:text="${#temporals.format(timestamp, 'dd/MM/yyyy HH:mm:ss')}">--</strong></div>
            </div>

            <div class="actions">
                <a class="btn btn-primary" th:href="@{/admin/dashboard}">Voltar para o dashboard</a>
                <a class="btn btn-light" th:href="@{/}">Ir para a página inicial</a>
            </div>
        </div>
    </main>
</body>
</html>
